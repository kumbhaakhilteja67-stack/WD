<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration form</title>
</head> 
<body>
    <h2>Registration form</h2>
    <form action="/">
        <label for="username">Name:</label>
        <input type="text" placeholder="Enter your full name" id="username" name="fullname"
        required><br><br>

        <label for="email">Email:</label>
        <input type="password" id="password" name="password"
        required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"/><br> <br/>

        <label for="age">Age:</label>
        <input type="number" id="age"/><br> <br/>

        <label>Gender</label><br> <br/>
        <input type="radio" name="gender" value="Male" /> 
        <label for="male">Male</label>

        <input type="radio" name="gender" value="Female" /> 
        <label for="female">Female</label>

        <input type="radio" name="others" value="others" /> 
        <label for="others">others</label>

        <label for="dob">Date of birth</label>
        <input type="date" name="dob"><br> <br/>

        <label>Course:</label>
        <select name="course">
            <option value="Btech" selected>B.E</option>
            <option value="Mtech" >M.E</option>
            <option value="Diploma" >B.E</option>
        </select> <br/> <br/>
        
        <!-- Textarea -->
        <label>Address:</label>
        <textarea name="address"rows="3" col="30"></textarea><br/><br/>

        <!-- Checkbox -->
        <label>Hobbies:</label><br/><br/>
        <input type="checkbox" name="hobbies" id="reading" value="reading" />
        <label for="reading">reading</label>
        <input type="checkbox" name="hobbies" id="dancing" value="dancing" />
        <label for="dancing">dancing</label>
     </select>
    </form>
</body>
</html>
